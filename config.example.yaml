# Copy outside this repository and pass the resulting path with --config,
# or set HERMES_PROFILE_CONFIG_DIR to its directory.
managed_dir: /opt/hermes/managed

# These default to <managed_dir>/profiles and <managed_dir>/fragments when omitted.
# Live Hermes homes can sit beside managed/, not inside it.
profiles_dir: /opt/hermes/profiles
fragments_dir: /opt/hermes/managed/fragments

ui:
  animations: true
  theme: hermes-dracula

